<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Yellow rounded square background -->
  <rect width="80" height="80" rx="16" fill="#F4C753"/>

  <!-- Scallop shell — Camino de Santiago symbol -->
  <!-- Filled shell body -->
  <path d="M40 62 Q20 56 18 40 Q17 24 40 18 Q63 24 62 40 Q60 56 40 62Z"
        fill="#2C5F4F"/>

  <!-- Shell ribs (lighter lines over the fill) -->
  <g stroke="#F4C753" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <line x1="40" y1="61" x2="40" y2="19"/>
    <line x1="40" y1="61" x2="26" y2="23"/>
    <line x1="40" y1="61" x2="19" y2="34"/>
    <line x1="40" y1="61" x2="19" y2="47"/>
    <line x1="40" y1="61" x2="54" y2="23"/>
    <line x1="40" y1="61" x2="61" y2="34"/>
    <line x1="40" y1="61" x2="61" y2="47"/>
  </g>

  <!-- Scalloped bottom edge of shell -->
  <path d="M19 47 Q22 58 28 61 Q34 64 40 62 Q46 64 52 61 Q58 58 61 47"
        fill="#1F4438" stroke="none"/>

  <!-- Scallop bumps along bottom -->
  <path d="M19 47 Q23 54 28 54 Q33 54 35 51 Q37 49 40 49 Q43 49 45 51 Q47 54 52 54 Q57 54 61 47"
        fill="none" stroke="#F4C753" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Stem / base -->
  <path d="M36 62 Q38 68 40 68 Q42 68 44 62" fill="#1F4438" stroke="none"/>
</svg>