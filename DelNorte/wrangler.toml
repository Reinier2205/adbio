name = "delnorte"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Supabase configuration (set via secrets)
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_ANON_KEY

[vars]
ENVIRONMENT = "production"
APP_NAME = "DelNorte Camino Tracker"
TRAINING_START_DATE = "2026-11-01"
CAMINO_DATE = "2027-06-01"

# Assets configuration
[assets]
directory = "./public"
binding = "ASSETS"
