<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tri-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="tri-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="url(#tri-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Hexagon outline -->
  <polygon points="50,12 82,30 82,66 50,84 18,66 18,30"
    fill="none" stroke="#d4af37" stroke-width="2.5"/>

  <!-- Inner triangle dividers -->
  <line x1="50" y1="12" x2="50" y2="84" stroke="#d4af37" stroke-width="1.2" opacity="0.5"/>
  <line x1="82" y1="30" x2="18" y2="66" stroke="#d4af37" stroke-width="1.2" opacity="0.5"/>
  <line x1="18" y1="30" x2="82" y2="66" stroke="#d4af37" stroke-width="1.2" opacity="0.5"/>

  <!-- Three player tokens -->
  <circle cx="50" cy="20" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
  <text x="50" y="24" text-anchor="middle" font-size="9" font-family="Arial Black,sans-serif" font-weight="900" fill="#2a1a1f">1</text>

  <circle cx="75" cy="61" r="8" fill="#fff8e1" stroke="#d4af37" stroke-width="1.5"/>
  <text x="75" y="65" text-anchor="middle" font-size="9" font-family="Arial Black,sans-serif" font-weight="900" fill="#2a1a1f">2</text>

  <circle cx="25" cy="61" r="8" fill="#0a4821" stroke="#ffd700" stroke-width="2"/>
  <text x="25" y="65" text-anchor="middle" font-size="9" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700">3</text>

  <!-- Label -->
  <text x="50" y="96" text-anchor="middle" font-size="7" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700" letter-spacing="1">TRIGON</text>
</svg>
