<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="pb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="url(#pb-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Open book - left page -->
  <path d="M14,24 Q14,20 18,20 L48,22 L48,76 L18,74 Q14,74 14,70 Z" fill="#2a1a1f" stroke="#d4af37" stroke-width="2"/>
  <!-- Open book - right page -->
  <path d="M86,24 Q86,20 82,20 L52,22 L52,76 L82,74 Q86,74 86,70 Z" fill="#2a1a1f" stroke="#d4af37" stroke-width="2"/>
  <!-- Spine -->
  <rect x="47" y="20" width="6" height="56" rx="2" fill="#d4af37"/>

  <!-- Photo icon on left page (polaroid) -->
  <rect x="20" y="30" width="22" height="18" rx="2" fill="#fff8e1" stroke="#d4af37" stroke-width="1.5"/>
  <rect x="22" y="32" width="18" height="12" rx="1" fill="#0a4821"/>
  <!-- Mountain in photo -->
  <polygon points="24,42 31,34 38,42" fill="#d4af37" opacity="0.8"/>
  <circle cx="36" cy="36" r="2" fill="#ffd700"/>
  <!-- Photo bottom label area -->
  <rect x="20" y="44" width="22" height="4" rx="1" fill="#fff8e1"/>

  <!-- Camera icon on right page -->
  <rect x="56" y="36" width="24" height="18" rx="4" fill="#d4af37" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="68" cy="45" r="6" fill="#0a4821" stroke="#ffd700" stroke-width="1.5"/>
  <circle cx="68" cy="45" r="3" fill="#ffd700"/>
  <!-- Camera viewfinder bump -->
  <rect x="58" y="32" width="8" height="6" rx="2" fill="url(#pb-gold)"/>

  <!-- Page lines on left page -->
  <line x1="20" y1="56" x2="44" y2="56" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="62" x2="44" y2="62" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="68" x2="44" y2="68" stroke="#d4af37" stroke-width="1" opacity="0.5"/>

  <!-- Label -->
  <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700" letter-spacing="0.5">PAPERBOOK</text>
</svg>
