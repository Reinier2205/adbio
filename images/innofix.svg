<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="if-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="if-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="url(#if-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Wrench/spanner shape -->
  <g fill="#d4af37" stroke="#b8860b" stroke-width="1">
    <!-- Wrench handle -->
    <rect x="44" y="38" width="12" height="44" rx="4" fill="url(#if-gold)"/>
    <!-- Wrench top jaw -->
    <ellipse cx="50" cy="36" rx="12" ry="10" fill="none" stroke="#ffd700" stroke-width="3"/>
    <rect x="42" y="30" width="16" height="12" rx="2" fill="url(#if-gold)"/>
    <!-- Wrench gap -->
    <rect x="48" y="30" width="4" height="12" rx="1" fill="#0a4821"/>
  </g>

  <!-- Sun / solar panel in upper-right -->
  <circle cx="74" cy="26" r="9" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
  <!-- Sun rays -->
  <g stroke="#ffd700" stroke-width="1.5" stroke-linecap="round">
    <line x1="74" y1="12" x2="74" y2="9"/>
    <line x1="74" y1="40" x2="74" y2="43"/>
    <line x1="60" y1="26" x2="57" y2="26"/>
    <line x1="88" y1="26" x2="91" y2="26"/>
    <line x1="64" y1="16" x2="61" y2="13"/>
    <line x1="84" y1="36" x2="87" y2="39"/>
    <line x1="84" y1="16" x2="87" y2="13"/>
    <line x1="64" y1="36" x2="61" y2="39"/>
  </g>

  <!-- Label -->
  <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700" letter-spacing="0.5">INNOFIX</text>
</svg>
