<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="wab-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="url(#wab-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Speech bubble body -->
  <rect x="14" y="18" width="72" height="50" rx="14" fill="#2a1a1f" stroke="#d4af37" stroke-width="2.5"/>
  <!-- Speech bubble tail -->
  <polygon points="28,66 18,82 42,68" fill="#2a1a1f" stroke="#d4af37" stroke-width="2"/>

  <!-- W letter in bubble -->
  <text x="50" y="52" text-anchor="middle" font-size="34" font-family="Arial Black,sans-serif" font-weight="900" fill="url(#wab-gold)">W</text>

  <!-- Small WhatsApp-style dots signal -->
  <circle cx="60" cy="30" r="3" fill="#ffd700"/>
  <circle cx="70" cy="30" r="3" fill="#ffd700" opacity="0.6"/>
  <circle cx="80" cy="30" r="3" fill="#ffd700" opacity="0.3"/>

  <!-- Label -->
  <text x="50" y="94" text-anchor="middle" font-size="7" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700" letter-spacing="1">WAB SETUP</text>
</svg>
