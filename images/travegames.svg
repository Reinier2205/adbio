<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="tg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="url(#tg-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Suitcase body -->
  <rect x="18" y="38" width="64" height="42" rx="7" fill="#2a1a1f" stroke="#d4af37" stroke-width="2"/>
  <!-- Suitcase handle -->
  <rect x="36" y="30" width="28" height="10" rx="5" fill="none" stroke="#ffd700" stroke-width="2.5"/>
  <!-- Suitcase latch -->
  <rect x="44" y="55" width="12" height="8" rx="3" fill="url(#tg-gold)" stroke="#b8860b" stroke-width="1"/>
  <!-- Suitcase stripe -->
  <line x1="18" y1="59" x2="82" y2="59" stroke="#d4af37" stroke-width="1.5" opacity="0.7"/>

  <!-- Dice on suitcase -->
  <rect x="58" y="44" width="18" height="18" rx="3" fill="#fff8e1" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Dice dots: 3 -->
  <circle cx="62" cy="48" r="1.5" fill="#2a1a1f"/>
  <circle cx="67" cy="53" r="1.5" fill="#2a1a1f"/>
  <circle cx="72" cy="58" r="1.5" fill="#2a1a1f"/>

  <!-- Label -->
  <text x="50" y="90" text-anchor="middle" font-size="7" font-family="Arial Black,sans-serif" font-weight="900" fill="#ffd700" letter-spacing="0.5">TRAVEL GAMES</text>
</svg>
