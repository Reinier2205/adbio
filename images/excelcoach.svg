<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D6F42"/>
      <stop offset="100%" stop-color="#134e2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="56" height="56" rx="12" fill="url(#bg)"/>
  <!-- Spreadsheet grid lines -->
  <rect x="10" y="14" width="36" height="28" rx="2" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Column dividers -->
  <line x1="22" y1="14" x2="22" y2="42" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <line x1="34" y1="14" x2="34" y2="42" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- Row dividers -->
  <line x1="10" y1="21" x2="46" y2="21" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <line x1="10" y1="28" x2="46" y2="28" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <line x1="10" y1="35" x2="46" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- Header row fill -->
  <rect x="10" y="14" width="36" height="7" rx="2" fill="rgba(255,255,255,0.12)"/>
  <!-- Bar chart inside cells (bottom-right quadrant) -->
  <rect x="35.5" y="37" width="2.5" height="4" rx="0.5" fill="#F4C753"/>
  <rect x="39" y="33" width="2.5" height="8" rx="0.5" fill="#F4C753"/>
  <rect x="42.5" y="30" width="2.5" height="11" rx="0.5" fill="#F4C753"/>
  <!-- Graduation cap (coaching element) -->
  <polygon points="28,8 36,12 28,16 20,12" fill="#F4C753"/>
  <line x1="36" y1="12" x2="36" y2="17" stroke="#F4C753" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="36" cy="18" r="1.5" fill="#F4C753"/>
</svg>
