<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4821"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#bg)"/>
  <!-- Gold border glow -->
  <rect width="100" height="100" rx="14" fill="none" stroke="#d4af37" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Subtle center glow -->
  <rect width="100" height="100" rx="14" fill="url(#glow)"/>

  <!-- LED display panel -->
  <rect x="8" y="28" width="84" height="36" rx="6" fill="#0f0f18" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Inner LED shimmer line -->
  <rect x="10" y="30" width="80" height="32" rx="4" fill="#111122" stroke="#ffd700" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Scrolling LED text dots — simulate "LED" text in dot-matrix style -->
  <!-- Letter L -->
  <circle cx="20" cy="40" r="2" fill="#ffd700"/>
  <circle cx="20" cy="46" r="2" fill="#ffd700"/>
  <circle cx="20" cy="52" r="2" fill="#ffd700"/>
  <circle cx="24" cy="52" r="2" fill="#ffd700"/>
  <circle cx="28" cy="52" r="2" fill="#ffd700"/>

  <!-- Letter E -->
  <circle cx="33" cy="40" r="2" fill="#ffd700"/>
  <circle cx="37" cy="40" r="2" fill="#ffd700"/>
  <circle cx="41" cy="40" r="2" fill="#ffd700"/>
  <circle cx="33" cy="46" r="2" fill="#ffd700"/>
  <circle cx="37" cy="46" r="2" fill="#ffd700"/>
  <circle cx="33" cy="52" r="2" fill="#ffd700"/>
  <circle cx="37" cy="52" r="2" fill="#ffd700"/>
  <circle cx="41" cy="52" r="2" fill="#ffd700"/>

  <!-- Letter D -->
  <circle cx="46" cy="40" r="2" fill="#ffd700"/>
  <circle cx="50" cy="40" r="2" fill="#ffd700"/>
  <circle cx="46" cy="46" r="2" fill="#ffd700"/>
  <circle cx="54" cy="46" r="2" fill="#ffd700"/>
  <circle cx="46" cy="52" r="2" fill="#ffd700"/>
  <circle cx="50" cy="52" r="2" fill="#ffd700"/>

  <!-- Dot-matrix grid overlay — faint dim dots to suggest unlit LEDs -->
  <circle cx="62" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="66" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="70" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="74" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="78" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="62" cy="46" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="66" cy="46" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="70" cy="46" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="74" cy="46" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="78" cy="46" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="62" cy="52" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="66" cy="52" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="70" cy="52" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="74" cy="52" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="78" cy="52" r="1.2" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Motion arrows suggesting scroll direction -->
  <polyline points="14,72 20,68 26,72" fill="none" stroke="#008080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <polyline points="74,72 80,68 86,72" fill="none" stroke="#008080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Label -->
  <text x="50" y="86" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#d4af37" letter-spacing="1">SCROLLER</text>
</svg>
