<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4821"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <linearGradient id="brass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#b8860b"/>
      <stop offset="70%" stop-color="#cd853f"/>
      <stop offset="100%" stop-color="#8b4513"/>
    </linearGradient>
    <linearGradient id="needleN" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="needleS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="13" fill="url(#bg)"/>
  <rect width="100" height="100" rx="13" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.7"/>

  <!-- Compass outer ring -->
  <circle cx="50" cy="46" r="33" fill="url(#brass)" opacity="0.9"/>
  <circle cx="50" cy="46" r="33" fill="none" stroke="#ffd700" stroke-width="1"/>

  <!-- Inner compass face -->
  <circle cx="50" cy="46" r="28" fill="#1a3a28"/>
  <circle cx="50" cy="46" r="28" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.6"/>

  <!-- Cardinal tick marks -->
  <line x1="50" y1="19" x2="50" y2="23" stroke="#ffd700" stroke-width="1.5"/>
  <line x1="77" y1="46" x2="73" y2="46" stroke="#d4af37" stroke-width="1"/>
  <line x1="50" y1="73" x2="50" y2="69" stroke="#d4af37" stroke-width="1"/>
  <line x1="23" y1="46" x2="27" y2="46" stroke="#d4af37" stroke-width="1"/>

  <!-- Intercardinal ticks -->
  <line x1="70.2" y1="25.8" x2="67.9" y2="28.1" stroke="#d4af37" stroke-width="0.7" opacity="0.7"/>
  <line x1="70.2" y1="66.2" x2="67.9" y2="63.9" stroke="#d4af37" stroke-width="0.7" opacity="0.7"/>
  <line x1="29.8" y1="66.2" x2="32.1" y2="63.9" stroke="#d4af37" stroke-width="0.7" opacity="0.7"/>
  <line x1="29.8" y1="25.8" x2="32.1" y2="28.1" stroke="#d4af37" stroke-width="0.7" opacity="0.7"/>

  <!-- Cardinal labels -->
  <text x="50" y="26.5" font-family="Arial Black, sans-serif" font-size="6" fill="#e74c3c" text-anchor="middle" font-weight="bold" filter="url(#glow)">N</text>
  <text x="74" y="48.5" font-family="Arial Black, sans-serif" font-size="5.5" fill="#d4af37" text-anchor="middle">E</text>
  <text x="50" y="72" font-family="Arial Black, sans-serif" font-size="5.5" fill="#d4af37" text-anchor="middle">S</text>
  <text x="26" y="48.5" font-family="Arial Black, sans-serif" font-size="5.5" fill="#d4af37" text-anchor="middle">W</text>

  <!-- Compass needle - North (red) -->
  <polygon points="50,26 47.5,46 52.5,46" fill="url(#needleN)" filter="url(#glow)"/>
  <!-- Compass needle - South (white) -->
  <polygon points="50,66 47.5,46 52.5,46" fill="url(#needleS)"/>

  <!-- Center pivot -->
  <circle cx="50" cy="46" r="3" fill="url(#brass)"/>
  <circle cx="50" cy="46" r="1.5" fill="#ffd700"/>

  <!-- Sunrise dot (orange) on compass ring - NE area -->
  <circle cx="69" cy="27" r="3" fill="#ff6b35" opacity="0.9" filter="url(#glow)"/>
  <!-- Sunset dot (red) on compass ring - NW area -->
  <circle cx="31" cy="27" r="3" fill="#c0392b" opacity="0.9"/>

  <!-- Label -->
  <text x="50" y="97" font-family="Cinzel, serif" font-size="8" fill="#d4af37" text-anchor="middle" font-weight="bold">NAVIGATOR</text>
</svg>
