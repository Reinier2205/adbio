<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4821"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <linearGradient id="dn-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="dn-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
    <filter id="dn-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#dn-bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="13" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>

  <!-- Sky gradient panel -->
  <rect x="8" y="8" width="84" height="52" rx="6" fill="url(#dn-sky)" opacity="0.85"/>

  <!-- Mountains -->
  <polygon points="10,60 28,30 46,60" fill="#1a5c38" opacity="0.9"/>
  <polygon points="30,60 52,22 74,60" fill="#0d4a2c" opacity="0.95"/>
  <polygon points="55,60 74,35 92,60" fill="#1a5c38" opacity="0.85"/>
  <!-- Snow caps -->
  <polygon points="52,22 46,33 58,33" fill="#fff8e1" opacity="0.85"/>
  <polygon points="28,30 24,38 32,38" fill="#fff8e1" opacity="0.7"/>

  <!-- Camino path winding through -->
  <path d="M10,72 Q25,65 40,70 Q55,75 70,67 Q82,62 92,65" fill="none" stroke="url(#dn-path)" stroke-width="3.5" stroke-linecap="round" filter="url(#dn-glow)"/>

  <!-- Walking figure -->
  <g transform="translate(42,52)" filter="url(#dn-glow)">
    <!-- Head -->
    <circle cx="0" cy="-14" r="4" fill="#fff8e1"/>
    <!-- Body -->
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#fff8e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="0" y1="-7" x2="-5" y2="-3" stroke="#fff8e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="6" y2="-5" stroke="#fff8e1" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="0" y1="0" x2="-4" y2="8" stroke="#fff8e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="6" stroke="#fff8e1" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Walking staff -->
    <line x1="6" y1="-5" x2="9" y2="8" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Backpack -->
    <rect x="1" y="-10" width="5" height="7" rx="1.5" fill="#008080" opacity="0.9"/>
  </g>

  <!-- Scallop shell badge (Camino symbol) -->
  <g transform="translate(78,18)">
    <circle cx="0" cy="0" r="9" fill="#d4af37" opacity="0.95"/>
    <!-- Shell ridges -->
    <path d="M0,-7 L0,5" stroke="#2a1a1f" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M-3.5,-6 Q-5,0 -3,5" stroke="#2a1a1f" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M3.5,-6 Q5,0 3,5" stroke="#2a1a1f" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M-6.5,-3 Q-7,2 -5,5" stroke="#2a1a1f" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M6.5,-3 Q7,2 5,5" stroke="#2a1a1f" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Shell base arc -->
    <path d="M-7,5 Q0,9 7,5" fill="#a07820" stroke="none"/>
  </g>

  <!-- Label -->
  <text x="50" y="95" text-anchor="middle" font-family="Cinzel, serif" font-size="7.5" font-weight="bold" fill="#d4af37" letter-spacing="1">DEL NORTE</text>
</svg>
