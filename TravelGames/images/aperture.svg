<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5a2c"/>
      <stop offset="100%" stop-color="#0a4821"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldRadial" cx="50%" cy="50%" r="50%" fx="35%" fy="35%" id="goldRadial" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect x="8" y="8" width="184" height="184" rx="12" fill="url(#felt)" stroke="#d4af37" stroke-width="4"/>

  <!-- Glow behind iris -->
  <circle cx="100" cy="96" r="44" fill="url(#glowCenter)"/>

  <!-- Outer ring -->
  <circle cx="100" cy="96" r="44" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- Aperture iris blades (6 blades, rotated 60° each) -->
  <g fill="rgba(0,0,0,0.55)" stroke="#ffd700" stroke-width="1.5">
    <!-- blade 0 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(0 100 96)"/>
    <!-- blade 1 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(60 100 96)"/>
    <!-- blade 2 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(120 100 96)"/>
    <!-- blade 3 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(180 100 96)"/>
    <!-- blade 4 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(240 100 96)"/>
    <!-- blade 5 -->
    <path d="M100,96 L116,58 Q128,72 120,96 Z" transform="rotate(300 100 96)"/>
  </g>

  <!-- Inner iris opening (dark circle) -->
  <circle cx="100" cy="96" r="16" fill="#1a1a1a" stroke="#ffd700" stroke-width="2"/>

  <!-- AI spark in center -->
  <circle cx="100" cy="96" r="7" fill="url(#gold)"/>
  <circle cx="100" cy="96" r="3" fill="#fffde7"/>

  <!-- Title badge -->
  <rect x="44" y="152" width="112" height="24" rx="6" fill="rgba(0,0,0,0.35)" stroke="#d4af37" stroke-width="2"/>
  <text x="100" y="169" text-anchor="middle" font-family="Cinzel, serif" font-size="14" fill="#ffd700">APERTURE</text>
</svg>
