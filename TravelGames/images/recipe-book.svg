<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a0f"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e8d9c4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#bg)"/>
  <!-- Gold border glow -->
  <rect x="2" y="2" width="96" height="96" rx="13" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>

  <!-- Recipe card -->
  <rect x="18" y="14" width="64" height="72" rx="5" fill="url(#card)" opacity="0.95"/>
  <!-- Left accent bar -->
  <rect x="18" y="14" width="5" height="72" rx="3" fill="#C99A2E"/>

  <!-- Photo placeholder area -->
  <rect x="26" y="20" width="48" height="26" rx="4" fill="#d4b896" opacity="0.6"/>
  <!-- Camera icon in photo area -->
  <circle cx="50" cy="33" r="7" fill="none" stroke="#8C3B2B" stroke-width="1.5" opacity="0.7"/>
  <circle cx="50" cy="33" r="3" fill="#8C3B2B" opacity="0.7"/>

  <!-- Title lines -->
  <rect x="26" y="52" width="36" height="3.5" rx="2" fill="#454F2E" opacity="0.8"/>
  <rect x="26" y="58" width="24" height="2.5" rx="1.5" fill="#454F2E" opacity="0.4"/>

  <!-- Ingredient dots -->
  <circle cx="28" cy="67" r="2" fill="#C99A2E"/>
  <rect x="32" y="65.5" width="22" height="2" rx="1" fill="#454F2E" opacity="0.45"/>
  <circle cx="28" cy="73" r="2" fill="#C99A2E"/>
  <rect x="32" y="71.5" width="18" height="2" rx="1" fill="#454F2E" opacity="0.45"/>
  <circle cx="28" cy="79" r="2" fill="#C99A2E"/>
  <rect x="32" y="77.5" width="26" height="2" rx="1" fill="#454F2E" opacity="0.45"/>

  <!-- Fork & knife icon (bottom right of card) -->
  <g transform="translate(64,60)" opacity="0.7">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#8C3B2B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-3,0 C-3,0 -3,5 0,5 C3,5 3,0 3,0" fill="none" stroke="#8C3B2B" stroke-width="1.2"/>
    <line x1="5" y1="0" x2="5" y2="14" stroke="#454F2E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="6" x2="8" y2="3" stroke="#454F2E" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="8" y2="14" stroke="#454F2E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Camp tent badge (top right) -->
  <circle cx="80" cy="22" r="10" fill="#2A7B6F" opacity="0.9"/>
  <text x="80" y="26.5" text-anchor="middle" font-size="11" fill="#fff">🏕</text>
</svg>
