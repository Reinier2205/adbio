<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4821"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <linearGradient id="rb-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e0cfb8"/>
    </linearGradient>
  </defs>

  <!-- Dark casino background -->
  <rect width="100" height="100" rx="14" fill="url(#rb-bg)"/>
  <!-- Gold border glow -->
  <rect x="2" y="2" width="96" height="96" rx="13" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>

  <!-- Recipe card (warm paper) -->
  <rect x="16" y="12" width="68" height="76" rx="6" fill="url(#rb-card)" opacity="0.96"/>
  <!-- Mustard left accent bar -->
  <rect x="16" y="12" width="5" height="76" rx="3" fill="#d4af37"/>

  <!-- Photo placeholder -->
  <rect x="24" y="18" width="52" height="28" rx="4" fill="#c8a87a" opacity="0.55"/>
  <!-- Camera icon -->
  <circle cx="50" cy="32" r="8" fill="none" stroke="#800000" stroke-width="1.8" opacity="0.75"/>
  <circle cx="50" cy="32" r="3.5" fill="#800000" opacity="0.75"/>
  <rect x="44" y="25" width="6" height="3" rx="1" fill="#800000" opacity="0.6"/>

  <!-- Recipe title bar -->
  <rect x="24" y="50" width="40" height="4" rx="2" fill="#2a1a1f" opacity="0.75"/>
  <rect x="24" y="57" width="28" height="2.5" rx="1.5" fill="#2a1a1f" opacity="0.35"/>

  <!-- Ingredient lines with gold bullets -->
  <circle cx="26.5" cy="66" r="2" fill="#d4af37"/>
  <rect x="31" y="64.5" width="24" height="2" rx="1" fill="#2a1a1f" opacity="0.4"/>
  <circle cx="26.5" cy="73" r="2" fill="#d4af37"/>
  <rect x="31" y="71.5" width="19" height="2" rx="1" fill="#2a1a1f" opacity="0.4"/>
  <circle cx="26.5" cy="80" r="2" fill="#d4af37"/>
  <rect x="31" y="78.5" width="28" height="2" rx="1" fill="#2a1a1f" opacity="0.4"/>

  <!-- Fork & knife (gold, bottom-right of card) -->
  <g transform="translate(66,58)" opacity="0.85">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-3.5,0 C-3.5,0 -3.5,6 0,6 C3.5,6 3.5,0 3.5,0" fill="none" stroke="#d4af37" stroke-width="1.4"/>
    <line x1="6" y1="0" x2="6" y2="16" stroke="#ffd700" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="6" y1="7" x2="9.5" y2="3" stroke="#ffd700" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="9.5" y1="0" x2="9.5" y2="16" stroke="#ffd700" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Teal camp badge (top-right corner) -->
  <circle cx="79" cy="21" r="11" fill="#008080" opacity="0.92"/>
  <text x="79" y="25.5" text-anchor="middle" font-size="12" fill="#fff">🏕</text>

  <!-- Label -->
  <text x="50" y="97" text-anchor="middle" font-family="Cinzel, serif" font-size="7" font-weight="bold" fill="#d4af37" letter-spacing="1">RECIPES</text>
</svg>
