<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160d2b"/>
      <stop offset="100%" stop-color="#2a1a3e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b36bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b36bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="13" fill="url(#bg)"/>
  <rect width="100" height="100" rx="13" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>

  <!-- Glow halos -->
  <ellipse cx="38" cy="42" rx="22" ry="22" fill="url(#glow1)"/>
  <ellipse cx="68" cy="58" rx="16" ry="16" fill="url(#glow2)"/>

  <!-- Jacaranda petals drifting (small purple ellipses) -->
  <ellipse cx="20" cy="18" rx="3" ry="5" fill="#b36bff" opacity="0.7" transform="rotate(-20 20 18)"/>
  <ellipse cx="75" cy="12" rx="2.5" ry="4.5" fill="#d6bfff" opacity="0.6" transform="rotate(15 75 12)"/>
  <ellipse cx="85" cy="30" rx="2" ry="4" fill="#b36bff" opacity="0.5" transform="rotate(-10 85 30)"/>
  <ellipse cx="12" cy="55" rx="2" ry="3.5" fill="#d6bfff" opacity="0.5" transform="rotate(25 12 55)"/>
  <ellipse cx="88" cy="70" rx="2.5" ry="4" fill="#b36bff" opacity="0.4" transform="rotate(-30 88 70)"/>

  <!-- Large centre flower (pink/yellow) -->
  <g filter="url(#glow)" transform="translate(38,42)">
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(0)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(45)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(90)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(135)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(180)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(225)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(270)"/></g>
    <g><ellipse cx="0" cy="-11" rx="4.5" ry="6.5" fill="#ff2d95" stroke="#fff" stroke-width="0.8" transform="rotate(315)"/></g>
    <circle r="5" fill="#ffe100" stroke="#fff" stroke-width="0.8"/>
  </g>

  <!-- Small flower top-right (orange/white) -->
  <g filter="url(#glow)" transform="translate(68,30)">
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(0)"/></g>
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(60)"/></g>
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(120)"/></g>
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(180)"/></g>
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(240)"/></g>
    <g><ellipse cx="0" cy="-7" rx="3" ry="4.5" fill="#ff8a00" stroke="#fff" stroke-width="0.6" transform="rotate(300)"/></g>
    <circle r="3.5" fill="#ffffff" stroke="#fff" stroke-width="0.6"/>
  </g>

  <!-- Small flower lower-right (purple/gold) -->
  <g filter="url(#glow)" transform="translate(70,62)">
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(0)"/></g>
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(60)"/></g>
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(120)"/></g>
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(180)"/></g>
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(240)"/></g>
    <g><ellipse cx="0" cy="-6.5" rx="2.8" ry="4" fill="#b36bff" stroke="#fff" stroke-width="0.6" transform="rotate(300)"/></g>
    <circle r="3" fill="#ffe100" stroke="#fff" stroke-width="0.6"/>
  </g>

  <!-- Tiny scatter flowers -->
  <g transform="translate(20,70)">
    <g><ellipse cx="0" cy="-5" rx="2" ry="3" fill="#18c8ff" transform="rotate(0)"/></g>
    <g><ellipse cx="0" cy="-5" rx="2" ry="3" fill="#18c8ff" transform="rotate(72)"/></g>
    <g><ellipse cx="0" cy="-5" rx="2" ry="3" fill="#18c8ff" transform="rotate(144)"/></g>
    <g><ellipse cx="0" cy="-5" rx="2" ry="3" fill="#18c8ff" transform="rotate(216)"/></g>
    <g><ellipse cx="0" cy="-5" rx="2" ry="3" fill="#18c8ff" transform="rotate(288)"/></g>
    <circle r="2.5" fill="#ffe100"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="55" cy="20" r="1.2" fill="#ffe100" opacity="0.9"/>
  <circle cx="22" cy="35" r="1" fill="#ff2d95" opacity="0.8"/>
  <circle cx="82" cy="48" r="1.1" fill="#ffe100" opacity="0.7"/>
  <circle cx="30" cy="80" r="0.9" fill="#b36bff" opacity="0.8"/>
  <circle cx="60" cy="78" r="1" fill="#ff8a00" opacity="0.7"/>

  <!-- Label -->
  <text x="50" y="93" font-family="Arial Black, sans-serif" font-size="7.5" fill="#d4af37" text-anchor="middle" font-weight="bold">FLOWER POWER</text>
</svg>
