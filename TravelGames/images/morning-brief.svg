<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4821"/>
      <stop offset="100%" stop-color="#2a1a1f"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="42%" r="28%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="url(#bg)"/>
  <!-- Gold border glow -->
  <rect width="100" height="100" rx="14" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.55"/>

  <!-- Sun glow halo -->
  <circle cx="50" cy="42" r="28" fill="url(#sun-glow)"/>

  <!-- Sun body -->
  <circle cx="50" cy="42" r="13" fill="#ffd700"/>

  <!-- Sun rays -->
  <g stroke="#ffd700" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="22" x2="50" y2="17"/>
    <line x1="50" y1="62" x2="50" y2="67"/>
    <line x1="30" y1="42" x2="25" y2="42"/>
    <line x1="70" y1="42" x2="75" y2="42"/>
    <line x1="35.9" y1="27.9" x2="32.3" y2="24.3"/>
    <line x1="64.1" y1="56.1" x2="67.7" y2="59.7"/>
    <line x1="64.1" y1="27.9" x2="67.7" y2="24.3"/>
    <line x1="35.9" y1="56.1" x2="32.3" y2="59.7"/>
  </g>

  <!-- Envelope body -->
  <rect x="18" y="62" width="64" height="26" rx="5" fill="#1a3a28" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Envelope flap lines (letter peek) -->
  <line x1="18" y1="62" x2="50" y2="78" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="62" x2="50" y2="78" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Letter lines inside envelope -->
  <line x1="30" y1="72" x2="52" y2="72" stroke="#ffd700" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="78" x2="46" y2="78" stroke="#ffd700" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
