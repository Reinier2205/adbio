<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Power</title>
<style>
:root{--bg:#160d2b;--fg:#f3e8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#160d2b;--fg:#f3e8ff}}
:root[data-theme="dark"]{--bg:#160d2b;--fg:#f3e8ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
#stage{position:relative}
#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(22,13,43,.78);color:var(--fg);padding:8px 16px;border-radius:999px;font-size:15px;font-weight:600;pointer-events:none;transition:opacity .6s}
</style></head><body>
<div id="stage"><img alt="Lilac car with flower power decals under a jacaranda tree" src="car.jpg"><canvas id="fx"></canvas></div>
<div id="hint">Tap for flower power</div>
<script>
const W=768,H=1364,stage=document.getElementById('stage'),cv=document.getElementById('fx'),ctx=cv.getContext('2d'),hint=document.getElementById('hint');
let S=1,D=1;
function fit(){const w=innerWidth,h=document.body.clientHeight||innerHeight;S=Math.min(w/W,h/H);stage.style.width=W*S+'px';stage.style.height=H*S+'px';D=Math.min(devicePixelRatio||1,2);cv.width=W*S*D;cv.height=H*S*D}
addEventListener('resize',fit);fit();
setTimeout(()=>hint.style.opacity=0,5000);
const PAL=[['#ff2d95','#ffe100'],['#ff8a00','#ffffff'],['#ffd400','#ff2d95'],['#18c8ff','#ffe100'],['#7ed321','#ff2d95'],['#b36bff','#ffe100']];
const R=Math.random;
function flower(x,y,r,rot,c,n){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineWidth=Math.max(2,r*.07);ctx.strokeStyle='#fff';
for(let i=0;i<n;i++){ctx.save();ctx.rotate(i*6.2832/n);ctx.beginPath();ctx.ellipse(0,-r*.58,r*.33,r*.45,0,0,7);ctx.fillStyle=c[0];ctx.fill();ctx.stroke();ctx.restore()}
ctx.beginPath();ctx.arc(0,0,r*.3,0,7);ctx.fillStyle=c[1];ctx.fill();ctx.stroke();ctx.restore()}
function petal(x,y,s,rot,spin,a){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(Math.cos(spin)*.8+.2,1);
ctx.fillStyle='#8f5cff';ctx.beginPath();ctx.ellipse(0,0,s*.5,s,0,0,7);ctx.fill();
ctx.fillStyle='#d6bfff';ctx.beginPath();ctx.ellipse(0,s*.35,s*.28,s*.45,0,0,7);ctx.fill();ctx.restore()}
// flower decals on the car: x, y, radius
const A=[[480,918,26],[437,903,12],[376,968,16],[441,932,10],[676,873,20],[663,940,20],[717,850,12],[647,862,10],[512,987,10],[600,985,12]];
const fl=[],lift=[],rain=[];
for(let i=0;i<70;i++)rain.push({x:R()*W,y:R()*H,s:7+R()*9,vy:45+R()*60,ph:R()*6,rot:R()*6,sp:R()*6,vs:1+R()*3});
function burst(x,y,n,big){for(let i=0;i<n;i++){const a=R()*6.283,v=(big?230:100)*(.4+R());fl.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?130:150),r:(big?24:13)+R()*(big?26:14),rot:R()*6,vr:(R()-.5)*7,age:0,life:1.8+R()*1.3,c:PAL[(R()*6)|0]})}}
stage.addEventListener('pointerdown',e=>{const b=stage.getBoundingClientRect();burst((e.clientX-b.left)/S,(e.clientY-b.top)/S,18,true);hint.style.opacity=0});
let last=performance.now(),t=0,nb=0,nl=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
ctx.setTransform(S*D,0,0,S*D,0,0);ctx.clearRect(0,0,W,H);
// jacaranda petals drifting down
for(const p of rain){p.y+=p.vy*dt;p.x+=(18+Math.sin(t*.9+p.ph)*30)*dt;p.rot+=dt*.8;p.sp+=p.vs*dt;if(p.y>H+20){p.y=-20;p.x=R()*W}if(p.x>W+20)p.x=-20;petal(p.x,p.y,p.s,p.rot,p.sp,.92)}
// petals lifting off the hood and windshield
nl+=dt*14;while(nl>1){nl--;const w=R()<.35;lift.push({x:w?340+R()*180:140+R()*320,y:w?790+R()*50:830+R()*110,vx:25+R()*60,vy:-(35+R()*70),s:7+R()*8,age:0,life:2.6+R()*2,rot:R()*6,sp:R()*6})}
for(let i=lift.length-1;i>=0;i--){const p=lift[i];p.age+=dt;if(p.age>p.life){lift.splice(i,1);continue}p.x+=(p.vx+Math.sin(t*3+p.rot)*30)*dt;p.y+=p.vy*dt;p.sp+=dt*4;const k=p.age/p.life;petal(p.x,p.y,p.s*(.6+k),p.rot+k*3,p.sp,Math.min(1,p.age*3)*(1-k*k))}
// decal flowers: grow, spin, glow
A.forEach((a,i)=>{const bl=.5+.5*Math.sin(t*2+i*1.3),sc=1.5+2.3*bl*bl,r=a[2]*sc,c=PAL[i%6];
ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(a[0],a[1],0,a[0],a[1],r*1.7);g.addColorStop(0,c[0]+'66');g.addColorStop(1,c[0]+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(a[0],a[1],r*1.7,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';
flower(a[0],a[1],r,t*(i%2?.9:-.9)+i,c,i%3?8:6)});
// bursts of flowers
nb+=dt;if(nb>1.1){nb=0;const a=A[(R()*A.length)|0];burst(a[0],a[1],6,false)}
for(let i=fl.length-1;i>=0;i--){const f=fl[i];f.age+=dt;if(f.age>f.life){fl.splice(i,1);continue}f.vy+=190*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;const k=f.age/f.life;ctx.globalAlpha=1-k*k*k;flower(f.x,f.y,f.r*Math.min(1,f.age*6),f.rot,f.c,8);ctx.globalAlpha=1}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
